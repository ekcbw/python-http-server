<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传表单</title>
</head>
<body>
    <h2>上传文件</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <div>
            <label for="file">文件:</label>
            <input type="file" id="file" name="file" required>
        </div>
        <div>
            <input type="radio" id="input-text" name="filetype" value="text" required>
            <label for="input-text">文本</label>
        </div>
        <div>
            <input type="radio" id="input-image" name="filetype" value="image">
            <label for="input-image">图片</label>
        </div>
        <div>
            <input type="radio" id="input-other" name="filetype" value="other">
            <label for="input-other">其他</label>
        </div>
        <button type="submit">上传</button>
    </form>
</body>
</html>
